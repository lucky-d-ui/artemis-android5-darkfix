name: Build Artemis 20.0.0 Dark Fix (Android 5)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout the build kit
        uses: actions/checkout@v4

      - name: Fetch exact working Artemis version and native submodule
        run: |
          git clone --recurse-submodules --depth 1 --branch 'v20.0.0+250712' \
            https://github.com/ClassicOldSong/moonlight-android.git artemis
          test -f artemis/app/src/main/jni/moonlight-core/moonlight-common-c/Makefile || \
            find artemis/app/src/main/jni/moonlight-core/moonlight-common-c -maxdepth 2 -type f | head

      - name: Patch dark theme only for old Android
        run: |
          cp fixes/styles-v21.xml artemis/app/src/main/res/values-v21/styles.xml
          grep -n 'Theme.AppCompat.NoActionBar' artemis/app/src/main/res/values-v21/styles.xml

      - name: Package complete matching source (including native submodule)
        run: |
          test -d artemis/app/src/main/jni/moonlight-core/moonlight-common-c
          test -f artemis/LICENSE.txt
          mkdir -p artemis-source-snapshot
          rsync -a \
            --exclude='.git' \
            --exclude='.gradle' \
            --exclude='build' \
            --exclude='local.properties' \
            artemis/ artemis-source-snapshot/
          # The native module is bundled as ordinary source, not as a Git pointer.
          rm -f artemis-source-snapshot/.gitmodules
          test -n "$(find artemis-source-snapshot/app/src/main/jni/moonlight-core/moonlight-common-c -type f -print -quit)"
          (cd artemis-source-snapshot && zip -q -r ../Artemis-20.0.0-Android5-DarkFix-source.zip .)

      - name: Upload complete source archive
        uses: actions/upload-artifact@v4
        with:
          name: Artemis-20.0.0-Android5-DarkFix-SOURCE
          path: Artemis-20.0.0-Android5-DarkFix-source.zip
          if-no-files-found: error

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK and NDK
        uses: android-actions/setup-android@v4

      - name: Install build dependencies
        run: |
          sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.0.12077973'
          printf 'sdk.dir=%s\nndk.dir=%s\n' "$ANDROID_HOME" "$ANDROID_HOME/ndk/27.0.12077973" > artemis/local.properties

      - name: Build debug APK (separate package from existing Artemis)
        working-directory: artemis
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleNonRoot_gameDebug --no-daemon --stacktrace

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Artemis-v20.0.0-Android5-DarkFix-APK
          path: artemis/app/build/outputs/apk/nonRoot_game/debug/*.apk
          if-no-files-found: error
